name: firmware-build

on:
  push:
    paths: ["firmware/**", "west.yml", ".github/workflows/firmware-build.yml"]
  pull_request:
    paths: ["firmware/**", "west.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0
    steps:
      - name: Checkout into workspace
        uses: actions/checkout@v4
        with:
          path: BLEhound

      - name: west init + update
        run: |
          west init -l BLEhound
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Build (BLEhound V1, first-batch board)
        run: west build -b blehound_v1/nrf54lm20a/cpuapp -s BLEhound/firmware -d build_dongle -- -DBOARD_ROOT=.

      - name: Build (BLEhound V2, revised board)
        run: west build -b blehound_v2/nrf54lm20a/cpuapp -s BLEhound/firmware -d build_dongle_v2 -- -DBOARD_ROOT=.
