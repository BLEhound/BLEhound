name: firmware-build

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware-build.yml"]
  pull_request:
    paths: ["firmware/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0
    defaults:
      run:
        # The toolchain container exports its env (west, cmake, SDK on PATH) only in a
        # LOGIN bash session; GitHub's default sh leaves them unset -> "west: not found".
        shell: bash -leo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: BLEhound

      # Self-contained west workspace: root = BLEhound/firmware, manifest repo = blehound.
      - name: west init + update
        working-directory: BLEhound/firmware
        run: |
          west init -l blehound
          west update --narrow -o=--depth=1
          west zephyr-export

      # Board defs auto-discovered via blehound/zephyr/module.yml (board_root); no -DBOARD_ROOT.
      - name: Build (BLEhound V1, first-batch board)
        working-directory: BLEhound/firmware
        run: west build -b blehound_v1/nrf54lm20a/cpuapp blehound/projects/blehound -d build --sysbuild

      - name: Build (BLEhound V2, revised board)
        working-directory: BLEhound/firmware
        run: west build -b blehound_v2/nrf54lm20a/cpuapp blehound/projects/blehound -d build_v2 --sysbuild
