# DFU: MCUboot "firmware loader" single-slot mode (partition table in boards/common/blehound_partitions.dtsi).
#  - MCUboot only verifies the signature and jumps, no dual-slot swap;
#  - the firmware loader is Nordic's stock samples/dfu/fw_loader/usb_mcumgr (SMP over USB CDC ACM),
#    only its USB identity is changed (sysbuild/usb_mcumgr.conf);
#  - button-less entry: on HOST_CMD_ENTER_DFU the app writes the boot mode into gpregret1 and resets,
#    MCUboot sees it and boots the loader (BOOT_MODE_ENTRANCE enables retention/boot mode in all three images).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_FIRMWARE_UPDATER=y
SB_CONFIG_MCUBOOT_MODE_FIRMWARE_UPDATER_BOOT_MODE_ENTRANCE=y
SB_CONFIG_FIRMWARE_LOADER_IMAGE_USB_MCUMGR=y
# Partitions come from the board devicetree, not from Partition Manager.
SB_CONFIG_PARTITION_MANAGER=n
# Signing: ed25519 "pure" (signature over the image itself, Nordic's recommendation on nRF54L); the public
# key is compiled into MCUboot, KMU is not used (KMU needs extra key provisioning at programming time, not
# introduced for now). Key file: MCUboot's bundled development key root-ed25519.pem by default; before
# production replace it with your own key and point SB_CONFIG_BOOT_SIGNATURE_KEY_FILE at it.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_PURE=y
SB_CONFIG_MCUBOOT_SIGNATURE_USING_KMU=n
# Also produce merged_<board target>.hex (MCUboot + loader + app) for whole-chip programming over J-Link.
SB_CONFIG_MERGED_HEX_FILES=y
