# USB identity of the firmware loader (Nordic samples/dfu/fw_loader/usb_mcumgr).
# The PID differs from the app's (0x520F "BLEhound Sniffer") so the host can tell from PID/product string that
# a board is in loader mode; the product string deliberately does not contain "BLEhound Sniffer" so scripts that
# find the capture port by product name do not mistake the loader port for a capture port.
CONFIG_CDC_ACM_SERIAL_VID=0x1915
CONFIG_CDC_ACM_SERIAL_PID=0x5210
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="BLEhound"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="BLEhound Loader"
