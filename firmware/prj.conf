# BLEhound Sniffer — application config (board-level settings live in boards/blehound_v*/)
# Goal: validate the full "build -> flash -> run" chain + three basics: LED, RTT logging, USB CDC ACM.
# Later stages (radio / connection following) will add config on top of this.

# --- Logging: over SEGGER RTT (via J-Link, the main dev/debug channel) ---
CONFIG_LOG=y
# 2026-09-20 switched to deferred: in immediate mode sniffer_thread writes every log
# line to RTT synchronously, so the moment J-Link attaches it slows the thread down and
# capture_q overflows, dropping frames (357 queue drops observed on real hardware).
# deferred lets a dedicated log thread dequeue, so the ISR/worker threads only copy the
# message and are no longer affected by RTT read speed.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# --- GPIO: on-board LED heartbeat ---
CONFIG_GPIO=y

# --- USB CDC ACM: host (Wireshark extcap) data channel ---
# nRF54LM20 USB is a DesignWare (usbhs) controller and **the legacy usb_device_stack has no driver for
# it**; only the new UDC / usb_device_stack_next stack has the udc_dwc2 + nRF54L usbhs glue. So the old
# stack is disabled, the new one enabled, and Zephyr's official sample_usbd helper initializes the device.
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
# Thread stacks: the new stack's defaults overflow on this chip's enumeration path (pinned down one by
# one from the Current thread in the fault dump):
#  - the usbd message-processing thread defaults to 1KB -- handling descriptors + class callbacks during
#    host enumeration/CDC configuration blows it (Current thread: usbd, STKOF). **This is the key fix.**
#  - the udc_dwc2 driver's internal thread defaults to 512B, which is a bit small.
#  - host_iface_init creates the device/descriptors on the main thread, so leave headroom there too.
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_UDC_DWC2_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
# Device identity used by sample_usbd_init.c (Zephyr's official USB init helper).
CONFIG_SAMPLE_USBD_MANUFACTURER="BLEhound"
CONFIG_SAMPLE_USBD_PRODUCT="BLEhound Sniffer"
CONFIG_SAMPLE_USBD_VID=0x1915
CONFIG_SAMPLE_USBD_PID=0x520F
# Serial layer: CDC ACM shows up as a UART device.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# --- Inter-chip link: the downstream master port (peer_link) uses the Zephyr SPI master API (design 4.2, P3) ---
CONFIG_SPI=y

# --- Radio: the sniffer takes over RADIO/TIMER/PPI directly, without enabling the Zephyr BLE controller ---
# Requires an external 32MHz crystal (the internal RC is not accurate enough); use clock_control to request HFXO.
CONFIG_CLOCK_CONTROL=y

# --- Runtime diagnostics ---
CONFIG_THREAD_NAME=y
CONFIG_PRINTK=y

# The RTT up buffer defaults to only 1KB, which fills up as soon as capture logs start (when full it
# drops new data, not overwrites old); enlarge it to 4KB to reduce the "I can't see any logs" confusion.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
