# nRF BLE Sniffer — P0 skeleton config
# Goal: validate the full "build -> flash -> run" chain + three basics: LED, RTT logging, USB CDC ACM.
# Later stages (radio / connection following) will add config on top of this.

# --- Logging: over SEGGER RTT (via J-Link, the main dev/debug channel) ---
CONFIG_LOG=y
# 2026-09-20 switched to deferred: in immediate mode sniffer_thread writes every log
# line to RTT synchronously, so the moment J-Link attaches it slows the thread down and
# capture_q overflows, dropping frames (357 queue drops observed on real hardware).
# deferred lets a dedicated log thread dequeue, so the ISR/worker threads only copy the
# message and are no longer affected by RTT read speed.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# --- GPIO: on-board LED heartbeat ---
CONFIG_GPIO=y

# --- USB CDC ACM: host (Wireshark extcap) data channel ---
# The USB "stack" choice is made per chip in the board-level conf (boards/<target>.conf):
#   - nRF52 series uses the legacy usb_device_stack (boards/nrf52840*.conf)
#   - nRF54L series USB is DesignWare (usbhs), only supported by the new UDC/usbd stack
#     (boards/nrf54lm20dk_nrf54lm20a_cpuapp.conf)
# Here we only put the serial-layer config common to both stacks (CDC ACM shows up as a UART device in both).
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# --- Radio: the sniffer takes over RADIO/TIMER/PPI directly, without enabling the Zephyr BLE controller ---
# Requires an external 32MHz crystal (the internal RC is not accurate enough); use clock_control to request HFXO.
CONFIG_CLOCK_CONTROL=y

# --- Runtime diagnostics ---
CONFIG_THREAD_NAME=y
CONFIG_PRINTK=y

# The RTT up buffer defaults to only 1KB, which fills up as soon as capture logs start (when full it
# drops new data, not overwrites old); enlarge it to 4KB to reduce the "I can't see any logs" confusion.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
