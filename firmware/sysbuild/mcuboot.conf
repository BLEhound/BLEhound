# Trimmed MCUboot configuration (firmware loader mode), after Nordic's nRF54LM20 dongle / single_slot
# samples: the 24 KB partition only holds signature verification + jump, everything else is off.
# Stay in the loader when there is no bootable app (image-0 fails verification / is empty): no bricking.
CONFIG_BOOT_FIRMWARE_LOADER_NO_APPLICATION=y
# The board has no button; the loader is entered through the boot mode only (sysbuild enables RETENTION_BOOT_MODE).
CONFIG_BOOT_FIRMWARE_LOADER_ENTRANCE_GPIO=n
CONFIG_GPIO=n

# nRF54L platform items (same as the DK sample)
CONFIG_CRACEN_IKG=n
CONFIG_CRACEN_PROVISION_PROT_RAM_INV_SLOTS_ON_INIT=n
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=32
CONFIG_FPROTECT=y

# Size reduction
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING=""
CONFIG_CLOCK_CONTROL=n
CONFIG_NRF_GRTC_START_SYSCOUNTER=n
CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_NRF_GRTC_TIMER=n
CONFIG_SPI_NOR=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# Keys are not stored in KMU (the public key is compiled into MCUboot), so turn CRACEN's KMU driver off too.
# Otherwise cracen_init() pushes KMU slots 248/249 (protected-RAM invalidation data); on this board those
# slots are not provisioned, the push returns a hardware failure -> psa_crypto_init fails -> k_panic and
# MCUboot hangs (hit on real hardware 2026-09-27; Nordic's DK flow provisions those slots as part of west flash).
CONFIG_CRACEN_LIB_KMU=n
