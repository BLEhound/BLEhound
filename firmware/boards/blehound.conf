# Differential config for the real board blehound (3x nRF54LM20A QFN52 + nRF21540) on top of the DK target.
# Goes with boards/blehound.overlay (real-board ball map). Usage (at the west workspace top level):
#   west build -b nrf54lm20dk/nrf54lm20a/cpuapp -d BLEhound/build_dongle -s BLEhound/firmware -- \
#     -DEXTRA_CONF_FILE=boards/blehound.conf \
#     -DEXTRA_DTC_OVERLAY_FILE=boards/blehound.overlay
#
# The real board **has no 32.768 kHz crystal** (XL1/XL2 = P1.00/P1.01 are used as inter-chip SPI GPIOs), so LFCLK must use the internal RC.
# Keeping the DK default K32SRC_XTAL would make it wait forever for the LFXO to start at boot: GRTC won't run, the kernel tick stops, and not a single log line appears.
# The ±500ppm accuracy only affects kernel timing; radio scheduling uses the HF TIMER (32 MHz crystal) and is unaffected.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# GPIOTE handler pool: SYNC (gpio0/gpiote30) + inter-chip REQ (gpio1/gpiote20) belong to two different gpiote instances,
# each needing one event handler. The default of 1 may not be enough, so enlarge it to ensure both interrupt sources can register.
CONFIG_NRFX_GPIOTE_NUM_OF_EVT_HANDLERS=4
