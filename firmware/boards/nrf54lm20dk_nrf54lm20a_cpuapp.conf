# USB config for the nRF54LM20A DK.
#
# The nRF54LM20 USB is a DesignWare (usbhs) controller, and **the legacy
# usb_device_stack has no driver for it**; only the new UDC / usb_device_stack_next
# stack has the udc_dwc2 + nRF54L usbhs glue.
# So here we explicitly disable the old stack, enable the new one, and use Zephyr's
# official sample_usbd helper to initialize the device.
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y

# Thread stacks: the new stack's defaults overflow on this chip's enumeration path
# (pinned down one by one from the Current thread in the fault dump):
#  - the usbd message-processing thread defaults to 1KB -- handling descriptors + class
#    callbacks during host enumeration/CDC configuration blows it (Current thread: usbd,
#    STKOF). **This is the key fix.**
#  - the udc_dwc2 driver's internal thread defaults to 512B, which is a bit small.
#  - host_iface_init creates the device/descriptors on the main thread, so leave some headroom on the main stack too.
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_UDC_DWC2_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# Device identity used by sample_usbd_init.c (Zephyr's official USB init helper), same as nRF52.
CONFIG_SAMPLE_USBD_MANUFACTURER="BLEhound"
CONFIG_SAMPLE_USBD_PRODUCT="nRF BLE Sniffer"
CONFIG_SAMPLE_USBD_VID=0x1915
CONFIG_SAMPLE_USBD_PID=0x520F

# The inter-chip link (peer_link) downstream master port uses the Zephyr SPI master API (design §4.2, P3).
# The overlay's tri-peer-spi points to a SPIM; on a single board / without that alias, peer_link uses a disabled stub and does not need this.
CONFIG_SPI=y
