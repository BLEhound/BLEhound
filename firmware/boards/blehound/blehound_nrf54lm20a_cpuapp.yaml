identifier: blehound/nrf54lm20a/cpuapp
name: BLEhound-nRF54LM20A-Application
type: mcu
arch: arm
toolchain:
  - gnuarmemb
  - zephyr
sysbuild: true
ram: 511
flash: 920
supported:
  - adc
  - counter
  - dmic
  - gpio
  - i2c
  - i2s
  - pwm
  - spi
  - usbd
  - watchdog
