<svg xmlns='http://www.w3.org/2000/svg' width='705' height='977' viewBox='0 0 705 977' font-family='-apple-system,"PingFang SC","Microsoft YaHei",sans-serif'><rect width='705' height='977' fill='#fff'/><text x='352.5' y='30' font-size='19' font-weight='700' fill='#111' text-anchor='middle'>USB Hub 排查测量点 · CH334F 区(顶层元件面·俯视)</text><text x='352.5' y='52' font-size='12.5' fill='#c0392b' text-anchor='middle'>▲ 上=板中(SMA侧)  下=USB-C · 黑表笔搭 G(GND),红表笔按 ①②③④ 量</text><rect x='308.0' y='130.0' width='136' height='136' rx='3' fill='#eef1f5' stroke='#8a97ab' stroke-width='1.5'/><text x='376.0' y='202.0' font-size='11' fill='#556' text-anchor='middle'>U7 CH334F</text><rect x='212.7999999999996' y='181.0' width='54.400000000000006' height='34.0' rx='3' fill='#eef1f5' stroke='#8a97ab' stroke-width='1.5'/><text x='240.0' y='202.0' font-size='10' fill='#556' text-anchor='middle'>C61</text><rect x='325.0' y='400.2999999999996' width='102' height='44.2' rx='3' fill='#eef1f5' stroke='#8a97ab' stroke-width='1.5'/><text x='376.0' y='426.3999999999998' font-size='10' fill='#556' text-anchor='middle'>L28</text><rect x='547.7000000000004' y='515.9000000000003' width='64.6' height='37.400000000000006' rx='3' fill='#eef1f5' stroke='#8a97ab' stroke-width='1.5'/><text x='580.0' y='538.6000000000001' font-size='10' fill='#556' text-anchor='middle'>FB7</text><rect x='144.80000000000058' y='658.7000000000004' width='47.599999999999994' height='30.6' rx='3' fill='#eef1f5' stroke='#8a97ab' stroke-width='1.5'/><text x='168.6000000000002' y='678.0' font-size='10' fill='#556' text-anchor='middle'>C64</text><rect x='223.0' y='660.4000000000008' width='306' height='149.60000000000002' rx='3' fill='#e6ecf5' stroke='#7a90b0' stroke-width='1.5'/><text x='376.0' y='739.2000000000004' font-size='11' fill='#556' text-anchor='middle'>USB-C J10</text><circle cx='603.1200000000002' cy='534.6000000000001' r='9' fill='#e07a1f' stroke='#111' stroke-width='1.5'/><text x='603.1200000000002' y='538.6000000000001' font-size='11' fill='#fff' font-weight='700' text-anchor='middle'>①</text><circle cx='168.6000000000002' cy='647.48' r='9' fill='#e07a1f' stroke='#111' stroke-width='1.5'/><text x='168.6000000000002' y='651.48' font-size='11' fill='#fff' font-weight='700' text-anchor='middle'>②</text><circle cx='223.68000000000035' cy='198.0' r='9' fill='#d64545' stroke='#111' stroke-width='1.5'/><text x='223.68000000000035' y='202.0' font-size='11' fill='#fff' font-weight='700' text-anchor='middle'>③</text><circle cx='384.5' cy='412.19999999999993' r='9' fill='#2f6fdb' stroke='#111' stroke-width='1.5'/><text x='384.5' y='416.19999999999993' font-size='11' fill='#fff' font-weight='700' text-anchor='middle'>④</text><circle cx='256.31999999999965' cy='198.0' r='9' fill='#333' stroke='#111' stroke-width='1.5'/><text x='256.31999999999965' y='202.0' font-size='11' fill='#fff' font-weight='700' text-anchor='middle'>G</text><circle cx='78' cy='853.0' r='8' fill='#e07a1f'/><text x='78' y='856.0' font-size='10' fill='#fff' font-weight='700' text-anchor='middle'>①</text><text x='92' y='857.0' font-size='12.5' fill='#222'><tspan font-weight='700'>VBUS</tspan>  5.0V — USB 插上就该有(USB-C座/磁珠FB7)</text><circle cx='78' cy='876.0' r='8' fill='#e07a1f'/><text x='78' y='879.0' font-size='10' fill='#fff' font-weight='700' text-anchor='middle'>②</text><text x='92' y='880.0' font-size='12.5' fill='#222'><tspan font-weight='700'>+5V</tspan>  5.0V — 磁珠 FB7 之后,进 hub V5</text><circle cx='78' cy='899.0' r='8' fill='#d64545'/><text x='78' y='902.0' font-size='10' fill='#fff' font-weight='700' text-anchor='middle'>③</text><text x='92' y='903.0' font-size='12.5' fill='#222'><tspan font-weight='700'>VDD33</tspan>  3.3V ⭐最关键 — hub 内部 LDO 输出</text><circle cx='78' cy='922.0' r='8' fill='#2f6fdb'/><text x='78' y='925.0' font-size='10' fill='#fff' font-weight='700' text-anchor='middle'>④</text><text x='92' y='926.0' font-size='12.5' fill='#222'><tspan font-weight='700'>上行D+</tspan>  ~3.3V — hub 工作时内部 1.5k 上拉</text><circle cx='78' cy='945.0' r='8' fill='#333'/><text x='78' y='948.0' font-size='10' fill='#fff' font-weight='700' text-anchor='middle'>G</text><text x='92' y='949.0' font-size='12.5' fill='#222'><tspan font-weight='700'>GND</tspan>  黑表笔参考地(在③正右侧)</text><text x='70' y='976.0' font-size='11.5' fill='#333'>判读:①无5V→USB座/FB7虚焊;②有5V但③无3.3V→CH334F没上电/QFN虚焊(尤其中心EP地);</text><text x='70' y='994.0' font-size='11.5' fill='#333'>③有3.3V但④不被拉高→hub没跑(才轮到怀疑内部时钟,试外接12MHz晶振)。</text></svg>