<text x='150' y='853' font-size='12.5' fill='#e07a1f'>   pin10=TD3(P0.04) 输入捕获边沿,pin8=TD2(P0.03) 开漏输出;固件开内部上拉,免外接电阻</text><text x='150' y='873' font-size='13.5' font-weight='700' fill='#8b5cf6'>② strap(TD0=pin4/TD1=pin6):紫=接pin3(GND)读0,红=接pin1(3V3)读1。U1 pin4+pin6→3 · U2 pin4→3,pin6→1 · U3 pin6→3,pin4→1</text><text x='150' y='893' font-size='11.5' fill='#555'>共 11 根(SYNC 5 + strap 6)。焊点=排针针脚露锡点。pin1=方框。坐标取自生产 Gerber(0908)。2026-09-19 定稿。</text></svg>